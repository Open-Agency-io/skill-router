name: Release

# Pushing a `v*` tag builds exactly two artifacts — the gate-validated npm
# tarball and its SHA256SUMS — and attaches them to a GitHub Release.
#
# Two jobs, deliberately split:
#   * `build` is read-only (`contents: read`). It is the only job that may run
#     candidate-controlled code (`npm ci` / `npm run check` / `npm test` /
#     `npm run gate:release`), and it records the exact artifact bundle as job
#     outputs after verifying it locally.
#   * `release` holds `contents: write` and never checks out the repository,
#     never installs Node, and never executes candidate code. It starts on a
#     fresh runner (so nothing the build job wrote to `GITHUB_PATH`, `PATH`, or
#     any workspace can reach it), downloads the bundle into a new directory,
#     re-verifies it, and only then creates the release.
#
# npm publication is deliberately Phase 12: this workflow never publishes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and validate artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Read-only on purpose: nothing that runs candidate code may escalate.
      contents: read
    outputs:
      # The exact bundle the read-only job proved: name, sizes, and digests.
      # The release job re-derives all five from the downloaded files and
      # compares, so a mismatched transfer cannot be released.
      tarball_name: ${{ steps.bundle.outputs.tarball_name }}
      tarball_size: ${{ steps.bundle.outputs.tarball_size }}
      tarball_sha256: ${{ steps.bundle.outputs.tarball_sha256 }}
      sums_size: ${{ steps.bundle.outputs.sums_size }}
      sums_sha256: ${{ steps.bundle.outputs.sums_sha256 }}
    steps:
      - name: Checkout
        # actions/checkout v7.0.1, pinned to an immutable commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Candidate code runs in this workspace, so no token is ever
          # persisted into the checkout's git configuration.
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v7.1.0, pinned to an immutable commit SHA.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release check gate
        run: npm run check

      - name: Test suite
        run: npm test

      - name: Build and validate release artifacts
        # Context arrives through `env` and is quoted in the script, so a tag
        # name can never be interpolated into a command line.
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run gate:release

      - name: Verify checksums locally
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Record the exact artifact bundle
        id: bundle
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          entries=(dist/*)
          if [ "${#entries[@]}" -ne 2 ]; then
            echo "expected exactly two artifacts in dist, found ${#entries[@]}" >&2
            printf '  %s\n' "${entries[@]}" >&2
            exit 1
          fi
          tarballs=(dist/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "expected exactly one tarball in dist, found ${#tarballs[@]}" >&2
            exit 1
          fi
          tarball=${tarballs[0]}
          sums=dist/SHA256SUMS
          if [ -L "$tarball" ] || [ -L "$sums" ] || [ ! -f "$tarball" ] || [ ! -f "$sums" ]; then
            echo "both artifacts must be regular files, never links" >&2
            exit 1
          fi
          name=${tarball#dist/}
          case "$name" in
            ""|*[!0-9A-Za-z._~+-]*)
              echo "refusing an unsafe artifact name: $name" >&2
              exit 1
              ;;
          esac
          {
            echo "tarball_name=$name"
            echo "tarball_size=$(wc -c < "$tarball" | tr -d '[:space:]')"
            echo "tarball_sha256=$(sha256sum "$tarball" | cut -d' ' -f1)"
            echo "sums_size=$(wc -c < "$sums" | tr -d '[:space:]')"
            echo "sums_sha256=$(sha256sum "$sums" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the verified artifact bundle
        # actions/upload-artifact v7.0.2, pinned to an immutable commit SHA.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error

  release:
    name: create github release
    # A separate, fresh runner: no build-job step can persist PATH additions,
    # GITHUB_PATH entries, credentials, or workspace state into this job.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # The only permission that is ever escalated, and only for this job.
      contents: write
    steps:
      - name: Download the verified artifact bundle
        # actions/download-artifact v8.0.2, pinned to an immutable commit SHA.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release-assets

      - name: Create the release with exactly two verified assets
        # No checkout, no setup-node, no npm: every command below is fixed
        # script text, and every value that arrives from outside is passed
        # through `env`, shape-checked, and quoted.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ARTIFACT_NAME: ${{ needs.build.outputs.tarball_name }}
          ARTIFACT_SIZE: ${{ needs.build.outputs.tarball_size }}
          ARTIFACT_SHA256: ${{ needs.build.outputs.tarball_sha256 }}
          SUMS_SIZE: ${{ needs.build.outputs.sums_size }}
          SUMS_SHA256: ${{ needs.build.outputs.sums_sha256 }}
        run: |
          set -euo pipefail

          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *)
              echo "refusing unexpected release tag: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "refusing a tag that is not an exact semantic version: $RELEASE_TAG" >&2
            exit 1
          fi

          # This job's only step is the pinned artifact download: no clone, no
          # toolchain, no repository code, and therefore no git remote for `gh`
          # to infer a repository from. Every `gh` call below names this exact
          # repository explicitly instead, so validate the runner-provided
          # identity once here and pass it to each invocation (the `gh api`
          # call already names the repository inside its path).
          if [[ ! "$GITHUB_REPOSITORY" =~ ^[0-9A-Za-z._-]+/[0-9A-Za-z._-]+$ ]]; then
            echo "refusing a malformed repository identity: ${GITHUB_REPOSITORY:-unset}" >&2
            exit 1
          fi
          if [ "$GITHUB_REPOSITORY" != "Open-Agency-io/skill-router" ]; then
            echo "refusing to release outside Open-Agency-io/skill-router (GITHUB_REPOSITORY is '$GITHUB_REPOSITORY')" >&2
            exit 1
          fi
          case "$ARTIFACT_NAME" in
            ""|*[!0-9A-Za-z._~+-]*)
              echo "refusing an unsafe artifact name from the build job: $ARTIFACT_NAME" >&2
              exit 1
              ;;
          esac
          case "$ARTIFACT_SIZE" in
            ""|*[!0-9]*)
              echo "the tarball size from the build job must be a plain integer" >&2
              exit 1
              ;;
          esac
          case "$SUMS_SIZE" in
            ""|*[!0-9]*)
              echo "the checksum size from the build job must be a plain integer" >&2
              exit 1
              ;;
          esac
          case "$ARTIFACT_SHA256" in
            ""|*[!0-9a-f]*)
              echo "the tarball digest from the build job must be lowercase hexadecimal" >&2
              exit 1
              ;;
          esac
          case "$SUMS_SHA256" in
            ""|*[!0-9a-f]*)
              echo "the checksum digest from the build job must be lowercase hexadecimal" >&2
              exit 1
              ;;
          esac

          # Exactly what the build job uploaded: two regular files, nothing
          # more, nothing hidden, no links.
          shopt -s nullglob dotglob
          received=(release-assets/*)
          if [ "${#received[@]}" -ne 2 ]; then
            echo "expected exactly two downloaded artifacts, found ${#received[@]}" >&2
            printf '  %s\n' "${received[@]}" >&2
            exit 1
          fi
          tarballs=(release-assets/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "expected exactly one tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          tarball=${tarballs[0]}
          if [ -L "$tarball" ] || [ -L release-assets/SHA256SUMS ] || [ ! -f "$tarball" ] || [ ! -f release-assets/SHA256SUMS ]; then
            echo "both downloaded artifacts must be regular files, never links" >&2
            exit 1
          fi
          if [ "$(basename "$tarball")" != "$ARTIFACT_NAME" ]; then
            echo "tarball name mismatch: $(basename "$tarball") != $ARTIFACT_NAME" >&2
            exit 1
          fi
          actual_size=$(wc -c < "$tarball" | tr -d '[:space:]')
          actual_sums_size=$(wc -c < release-assets/SHA256SUMS | tr -d '[:space:]')
          if [ "$actual_size" != "$ARTIFACT_SIZE" ] || [ "$actual_sums_size" != "$SUMS_SIZE" ]; then
            echo "size mismatch after transfer: tarball $actual_size/$ARTIFACT_SIZE, SHA256SUMS $actual_sums_size/$SUMS_SIZE" >&2
            exit 1
          fi

          # Immediate local verification, right before the release is created:
          # the payload re-checked against SHA256SUMS, and both files against
          # the digests the read-only build job recorded.
          (cd release-assets && sha256sum --check SHA256SUMS)
          actual_sha=$(sha256sum "$tarball" | cut -d' ' -f1)
          actual_sums_sha=$(sha256sum release-assets/SHA256SUMS | cut -d' ' -f1)
          if [ "$actual_sha" != "$ARTIFACT_SHA256" ] || [ "$actual_sums_sha" != "$SUMS_SHA256" ]; then
            echo "digest mismatch after transfer: tarball $actual_sha, SHA256SUMS $actual_sums_sha" >&2
            exit 1
          fi

          # An existing release for this tag is never touched: no asset upload,
          # no forced overwrite, no replacement. (If a release appears between
          # this check and the create below, `gh release create` fails instead
          # of overwriting it.)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists; refusing to overwrite or add assets to it" >&2
            exit 1
          fi

          # Create once, with only the two verified files, against this exact
          # repository — `--verify-tag` still requires the tag to exist there.
          gh release create "$RELEASE_TAG" "$tarball" "release-assets/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$RELEASE_TAG" --generate-notes

          # Post-create verification. `gh api` (REST) is used deliberately: it
          # returns exactly what the server sends, including the per-asset
          # `digest` when GitHub publishes one, without a client-side schema
          # restricting the fields. Exactly two assets, the expected names and
          # sizes, and a matching server digest whenever one is offered.
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq '.assets[] | [.name, (.size | tostring), (.digest // "")] | @tsv' > uploaded-assets.tsv
          # Plain `read`, not mapfile: the loop must run in this shell so an
          # `exit` below really exits the job.
          uploaded=()
          while IFS= read -r asset; do
            uploaded+=("$asset")
          done < uploaded-assets.tsv
          if [ "${#uploaded[@]}" -ne 2 ]; then
            echo "the release must carry exactly two assets, found ${#uploaded[@]}" >&2
            cat uploaded-assets.tsv >&2
            exit 1
          fi
          seen_tarball=0
          seen_sums=0
          digests_checked=0
          while IFS=$'\t' read -r name size digest; do
            case "$name" in
              "$ARTIFACT_NAME")
                seen_tarball=$((seen_tarball + 1))
                expected_size=$ARTIFACT_SIZE
                expected_sha=$ARTIFACT_SHA256
                ;;
              SHA256SUMS)
                seen_sums=$((seen_sums + 1))
                expected_size=$SUMS_SIZE
                expected_sha=$SUMS_SHA256
                ;;
              *)
                echo "unexpected asset on the release: $name" >&2
                exit 1
                ;;
            esac
            if [ "$size" != "$expected_size" ]; then
              echo "asset $name has size $size, expected $expected_size" >&2
              exit 1
            fi
            if [ -n "$digest" ]; then
              if [ "$digest" != "sha256:$expected_sha" ]; then
                echo "asset $name reports digest $digest, expected sha256:$expected_sha" >&2
                exit 1
              fi
              digests_checked=$((digests_checked + 1))
            fi
          done < uploaded-assets.tsv
          if [ "$seen_tarball" -ne 1 ] || [ "$seen_sums" -ne 1 ]; then
            echo "the release must carry exactly the tarball and SHA256SUMS" >&2
            cat uploaded-assets.tsv >&2
            exit 1
          fi
          if [ "$digests_checked" -eq 2 ]; then
            echo "both server asset digests match the verified sha256 digests"
          else
            # Documented fallback: when GitHub does not publish a digest for an
            # asset, the available evidence is the exact asset names and sizes
            # plus the local sha256 verification performed immediately before
            # the release was created. It is reported, never assumed.
            echo "server digests reported for ${digests_checked}/2 assets; names, sizes, and the pre-create sha256 verification are the remaining evidence"
          fi
          echo "release $RELEASE_TAG verified with exactly two assets"
